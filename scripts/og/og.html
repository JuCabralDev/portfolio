<!doctype html>
<!-- Template da imagem de compartilhamento (1200x630). Gerada por scripts/og/render.sh. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Martian Mono'; src: url('../../node_modules/@fontsource-variable/martian-mono/files/martian-mono-latin-standard-normal.woff2') format('woff2'); font-weight: 100 800; font-stretch: 75% 112.5%; }
  @font-face { font-family: 'Schibsted'; src: url('../../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 400 900; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #1a1310; color: #ede3d9; overflow: hidden; }
  body { box-sizing: border-box; padding: 76px 84px; display: grid; grid-template-rows: 1fr auto; font-family: 'Schibsted', sans-serif; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 40px; }
  .route { font: 500 26px 'Martian Mono'; font-stretch: 87.5%; color: #a8978a; }
  .route b { color: #f2a541; font-weight: 500; }
  h1 { margin: 36px 0 0; font: 600 92px/1.02 'Martian Mono'; font-stretch: 112.5%; letter-spacing: -0.02em; }
  .role { margin-top: 22px; font: 500 34px 'Martian Mono'; font-stretch: 87.5%; color: #f2a541; }
  img { width: 180px; height: 180px; border-radius: 50%; border: 2px solid #3a2d25; object-fit: cover; }
  .bottom { border-top: 1px solid #3a2d25; padding-top: 28px; display: flex; justify-content: space-between; font: 400 24px 'Martian Mono'; font-stretch: 87.5%; color: #a8978a; }
  .ok { color: #7fb77e; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="route"><b>GET</b> /api/julia <span class="ok">200 OK</span></div>
      <h1>Júlia Cabral</h1>
      <div class="role" id="role"></div>
    </div>
    <img src="../../public/avatar-512.jpg" alt="" />
  </div>
  <div class="bottom"><span id="stack">["Java 21", "Spring Boot", "SQL", "PostgreSQL"]</span><span id="place"></span></div>
  <script>
    const en = location.hash === '#en';
    document.getElementById('role').textContent = en ? 'Java Back-end Developer' : 'Desenvolvedora Back-end Java';
    document.getElementById('place').textContent = en ? 'Natal, Brazil' : 'Natal, RN';
  </script>
</body>
</html>
